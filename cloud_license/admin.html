<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一团智能客服 · 私售管理</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/admin/assets/admin.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div><p class="eyebrow">YITUAN123</p><h1>一团智能客服 · 私售管理</h1></div>
      <div id="sessionActions" class="session-actions hidden"><span id="adminName"></span><button id="logoutButton" class="secondary">退出</button></div>
    </header>

    <section id="loginPanel" class="card login-card">
      <h2>管理员登录</h2>
      <p class="muted">会话仅保存在安全的 HttpOnly Cookie 中，连续失败会临时锁定。</p>
      <form id="loginForm" class="grid three">
        <label>管理员账号<input id="adminUsername" autocomplete="username" required maxlength="80"></label>
        <label>管理员密码<input id="adminPassword" type="password" autocomplete="current-password" required maxlength="512"></label>
        <button type="submit">登录管理后台</button>
      </form>
    </section>

    <div id="dashboard" class="hidden">
      <section class="card">
        <h2>创建客户</h2>
        <form id="createUserForm" class="grid four">
          <label>登录账号<input id="username" autocomplete="off" required maxlength="160" placeholder="手机号、邮箱或自定义账号"></label>
          <label>初始密码<input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="512"></label>
          <label>客户备注<input id="displayName" maxlength="120" placeholder="微信昵称等"></label>
          <button type="submit">创建客户</button>
        </form>
      </section>

      <section class="card">
        <div class="section-head"><h2>客户与订阅</h2><button id="refreshUsersButton" class="secondary compact">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>客户</th><th>状态</th><th>套餐</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="users"><tr><td colspan="6" class="muted">正在加载</td></tr></tbody></table></div>
      </section>

      <section class="card">
        <div class="section-head"><h2>设备管理</h2><span id="deviceOwner" class="muted">请从客户列表选择</span></div>
        <div class="table-wrap"><table><thead><tr><th>设备名称</th><th>设备标识</th><th>状态</th><th>首次使用</th><th>最后在线</th><th>操作</th></tr></thead><tbody id="devices"><tr><td colspan="6" class="muted">暂无选择</td></tr></tbody></table></div>
      </section>

      <section class="card">
        <div class="section-head"><h2>审计记录</h2><button id="refreshAuditButton" class="secondary compact">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>目标</th><th>详情</th></tr></thead><tbody id="audit"><tr><td colspan="5" class="muted">正在加载</td></tr></tbody></table></div>
      </section>

      <section class="card">
        <h2>修改管理员密码</h2>
        <p class="muted">修改成功后会注销当前管理员的全部会话，需要重新登录。</p>
        <form id="changePasswordForm" class="grid three">
          <label>当前密码<input id="currentAdminPassword" type="password" autocomplete="current-password" required></label>
          <label>新密码<input id="newAdminPassword" type="password" autocomplete="new-password" minlength="14" required></label>
          <button type="submit">修改并退出</button>
        </form>
      </section>
    </div>

    <div id="message" class="toast hidden" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
